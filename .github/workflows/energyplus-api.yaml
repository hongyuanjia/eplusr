name: EnergyPlus API

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions: read-all

jobs:
  api:
    name: Stock ${{ matrix.eplus }} (${{ matrix.os }}, ${{ matrix.suite }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        eplus: ["26.1", "26.2"]
        suite: [full]
        include:
          - {os: ubuntu-latest, eplus: "9.4", suite: contract}
          - {os: ubuntu-latest, eplus: "9.5", suite: contract}
          - {os: ubuntu-latest, eplus: "9.6", suite: contract}
          - {os: ubuntu-latest, eplus: "22.1", suite: contract}
          - {os: ubuntu-latest, eplus: "22.2", suite: contract}
          - {os: ubuntu-latest, eplus: "23.1", suite: contract}
          - {os: ubuntu-latest, eplus: "23.2", suite: contract}
          - {os: ubuntu-latest, eplus: "24.1", suite: contract}
          - {os: ubuntu-latest, eplus: "24.2", suite: contract}
          - {os: ubuntu-latest, eplus: "25.1", suite: contract}
          - {os: ubuntu-latest, eplus: "25.2", suite: contract}
          - {os: macos-latest, eplus: "9.5", suite: contract}
          - {os: macos-latest, eplus: "23.2", suite: contract}
          - {os: macos-latest, eplus: "24.2", suite: contract}
          - {os: windows-latest, eplus: "9.4", suite: contract}
          - {os: windows-latest, eplus: "9.6", suite: contract}
          - {os: windows-latest, eplus: "23.2", suite: contract}
          - {os: windows-latest, eplus: "24.1", suite: contract}
          - {os: windows-latest, eplus: "24.2", suite: contract}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true
      RGL_USE_NULL: true
      _EPLUSR_RUN_API_TESTS_: true
      _EPLUSR_TEST_API_VERSION_: ${{ matrix.eplus }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::remotes, any::pkgload, any::devtools
      - name: Locate DuckDB extension directory
        shell: Rscript {0}
        run: |
          # Installation and tests must share a persistent extension directory.
          directory <- tools::R_user_dir("duckdb", "data")
          dir.create(directory, recursive = TRUE, showWarnings = FALSE)
          cat("DUCKDB_R_HOME=", directory, "\n", file = Sys.getenv("GITHUB_ENV"), append = TRUE, sep = "")
      - name: Install merged bridge and stock engines
        shell: Rscript {0}
        run: |
          # The merged bridge is used until its next CRAN release contains both required capabilities.
          remotes::install_github("hongyuanjia/rdyncall@98aac679adf8ace0c85075c5f4928075289eebbd", upgrade = "never")
          # Engine preparation owns installation; test helpers run in the test step.
          pkgload::load_all(".", quiet = TRUE, helpers = FALSE)
          # Helpers and restored installations may already provide either engine.
          versions <- unique(c(Sys.getenv("_EPLUSR_TEST_API_VERSION_"), get("LATEST_EPLUS_VER", asNamespace("eplusr"))))
          for (version in versions) {
              if (!eplusr::is_avail_eplus(version)) {
                  eplusr::install_eplus(version, local = TRUE, portable = TRUE)
              }
              stopifnot(eplusr::is_avail_eplus(version))
          }
          eplusr::install_duckdb_sqlite()
          devtools::install(".", upgrade = FALSE, quiet = TRUE)
      - name: Exercise full baseline regression
        if: matrix.suite == 'full'
        shell: Rscript {0}
        run: |
          # Test the installed candidate so native and engine children use the same code.
          testthat::test_local(".", filter = "^(api|plugin(-cli)?|run|job|group|param)$", load_package = "installed", stop_on_failure = TRUE)
      - name: Exercise maintained release contract
        if: matrix.suite == 'contract'
        shell: Rscript {0}
        run: source(".github/api-contract.R")
