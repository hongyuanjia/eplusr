name: EnergyPlus API

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions: read-all

jobs:
  api:
    name: Stock 26.1 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true
      RGL_USE_NULL: true
      _EPLUSR_RUN_API_TESTS_: true
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::remotes, any::pkgload, any::devtools
      - name: Install merged bridge and stock engines
        shell: Rscript {0}
        run: |
          # The merged bridge is used until its next CRAN release contains both required capabilities.
          remotes::install_github("hongyuanjia/rdyncall@98aac679adf8ace0c85075c5f4928075289eebbd", upgrade = "never")
          pkgload::load_all(".", quiet = TRUE)
          eplusr::install_eplus("26.1", local = TRUE)
          eplusr::install_eplus(get("LATEST_EPLUS_VER", asNamespace("eplusr")), local = TRUE)
          devtools::install(".", upgrade = FALSE, quiet = TRUE)
      - name: Exercise API jobs
        shell: Rscript {0}
        run: |
          devtools::test(filter = "^(api|run|job|group|param)$", stop_on_failure = TRUE)
