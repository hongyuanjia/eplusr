name: EnergyPlus API

on:
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      target_version:
        description: Stock release to rerun (empty selects the complete maintained matrix)
        type: string
        default: ""
      target_os:
        description: Runner label to rerun (empty selects all maintained platforms)
        type: string
        default: ""

permissions: read-all

jobs:
  matrix:
    name: Select maintained stock matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/github-script@v8
        id: select
        env:
          TARGET_VERSION: ${{ inputs.target_version }}
          TARGET_OS: ${{ inputs.target_os }}
        with:
          script: |
            // Select real maintained cells rather than creating skipped placeholder jobs.
            const cells = [];
            const platforms = ["ubuntu-latest", "macos-latest", "windows-latest"];
            for (const os of platforms) {
              for (const eplus of ["26.1", "26.2"]) cells.push({os, eplus, suite: "full"});
            }
            const older = {
              "ubuntu-latest": ["9.4", "9.5", "9.6", "22.1", "22.2", "23.1", "23.2", "24.1", "24.2", "25.1", "25.2"],
              "macos-latest": ["9.5", "23.2", "24.2"],
              "windows-latest": ["9.4", "9.6", "23.2", "24.1", "24.2"]
            };
            for (const [os, releases] of Object.entries(older)) {
              for (const eplus of releases) cells.push({os, eplus, suite: "contract"});
            }
            const version = process.env.TARGET_VERSION || "";
            const os = process.env.TARGET_OS || "";
            if (version && !cells.some(cell => cell.eplus === version)) throw new Error("Unknown stock release: " + version);
            if (os && !platforms.includes(os)) throw new Error("Unknown runner label: " + os);
            const selected = cells.filter(cell => (!version || cell.eplus === version) && (!os || cell.os === os));
            if (!selected.length) throw new Error("No maintained stock cell matches the requested release/platform.");
            core.setOutput("matrix", JSON.stringify({include: selected}));
  api:
    needs: matrix
    name: Stock ${{ matrix.eplus }} (${{ matrix.os }}, ${{ matrix.suite }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true
      RGL_USE_NULL: true
      _EPLUSR_RUN_API_TESTS_: true
      _EPLUSR_TEST_API_VERSION_: ${{ matrix.eplus }}
      _EPLUSR_TEST_API_SUITE_: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::remotes, any::pkgload, any::devtools
      - name: Locate DuckDB extension directory
        shell: Rscript {0}
        run: |
          # Installation and tests must share a persistent extension directory.
          directory <- tools::R_user_dir("duckdb", "data")
          dir.create(directory, recursive = TRUE, showWarnings = FALSE)
          cat("DUCKDB_R_HOME=", directory, "\n", file = Sys.getenv("GITHUB_ENV"), append = TRUE, sep = "")
      - name: Install merged bridge and stock engines
        shell: Rscript {0}
        run: |
          # The merged bridge is used until its next CRAN release contains both required capabilities.
          remotes::install_github("hongyuanjia/rdyncall@98aac679adf8ace0c85075c5f4928075289eebbd", upgrade = "never")
          # Engine preparation owns installation; test helpers run in the test step.
          pkgload::load_all(".", quiet = TRUE, helpers = FALSE)
          # Helpers and restored installations may already provide either engine.
          # Full regression retains the default 26.1 installation as well as the selected baseline.
          selected <- if (Sys.getenv("_EPLUSR_TEST_API_SUITE_") == "full") c("26.1", "26.2") else Sys.getenv("_EPLUSR_TEST_API_VERSION_")
          versions <- unique(c(selected, get("LATEST_EPLUS_VER", asNamespace("eplusr"))))
          for (version in versions) {
              if (!eplusr::is_avail_eplus(version)) {
                  eplusr::install_eplus(version, local = TRUE, portable = TRUE)
              }
              stopifnot(eplusr::is_avail_eplus(version))
          }
          eplusr::install_duckdb_sqlite()
          devtools::install(".", upgrade = FALSE, quiet = TRUE)
      - name: Exercise full baseline regression
        if: matrix.suite == 'full'
        shell: Rscript {0}
        run: |
          # Test the installed candidate so native and engine children use the same code.
          testthat::test_local(".", filter = "^(api|plugin(-cli)?|run|job|group|param)$", load_package = "installed", stop_on_failure = TRUE)
      - name: Exercise maintained release contract
        if: matrix.suite == 'contract'
        shell: Rscript {0}
        run: source(".github/api-contract.R")
